<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="netBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426"/>
      <stop offset="50%" stop-color="#0d213a"/>
      <stop offset="100%" stop-color="#06101e"/>
    </linearGradient>

    <!-- Glowing Lines -->
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="emeraldLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Filters for Cyber Glow -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="400" rx="24" fill="url(#netBg)" />
  <rect width="598" height="398" x="1" y="1" rx="23" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" />

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="50" y1="50" x2="550" y2="50" />
    <line x1="50" y1="120" x2="550" y2="120" />
    <line x1="50" y1="200" x2="550" y2="200" />
    <line x1="50" y1="280" x2="550" y2="280" />
    <line x1="50" y1="350" x2="550" y2="350" />
    <line x1="120" y1="40" x2="120" y2="360" />
    <line x1="220" y1="40" x2="220" y2="360" />
    <line x1="300" y1="40" x2="300" y2="360" />
    <line x1="380" y1="40" x2="380" y2="360" />
    <line x1="480" y1="40" x2="480" y2="360" />
  </g>

  <!-- Top Header Bar -->
  <rect x="40" y="24" width="520" height="38" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <circle cx="62" cy="43" r="4.5" fill="#ef4444" opacity="0.8" />
  <circle cx="77" cy="43" r="4.5" fill="#f59e0b" opacity="0.8" />
  <circle cx="92" cy="43" r="4.5" fill="#10b981" opacity="0.8" />
  <text x="115" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CISCO PACKET TRACER // IT NETWORK TOPOLOGY</text>
  <rect x="445" y="32" width="100" height="22" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
  <circle cx="458" cy="43" r="3" fill="#10b981" filter="url(#softGlow)" />
  <text x="468" y="47" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="600">CONNECTED</text>

  <!-- Network Connection Links (Cables / Bus) -->
  <g stroke-width="2" fill="none" opacity="0.8">
    <!-- Center to Top-Left (VLAN 10 Admin) -->
    <line x1="300" y1="195" x2="140" y2="120" stroke="url(#cyanLine)" stroke-dasharray="4,4" filter="url(#softGlow)" />
    <!-- Center to Top-Right (VLAN 20 Servers) -->
    <line x1="300" y1="195" x2="460" y2="120" stroke="url(#cyanLine)" stroke-dasharray="4,4" filter="url(#softGlow)" />
    <!-- Center to Bottom-Left (VLAN 30 IT Staff) -->
    <line x1="300" y1="215" x2="140" y2="290" stroke="url(#emeraldLine)" filter="url(#softGlow)" />
    <!-- Center to Bottom-Right (VLAN 40 Gateway / ISP) -->
    <line x1="300" y1="215" x2="460" y2="290" stroke="url(#emeraldLine)" filter="url(#softGlow)" />

    <!-- Inter-switch links -->
    <line x1="140" y1="120" x2="140" y2="290" stroke="rgba(255,255,255,0.12)" stroke-dasharray="2,2" />
    <line x1="460" y1="120" x2="460" y2="290" stroke="rgba(255,255,255,0.12)" stroke-dasharray="2,2" />
  </g>

  <!-- Data Packets (Glowing Dots Along Links) -->
  <circle cx="220" cy="157" r="3.5" fill="#38bdf8" filter="url(#strongGlow)" />
  <circle cx="380" cy="157" r="3.5" fill="#38bdf8" filter="url(#strongGlow)" />
  <circle cx="215" cy="255" r="3.5" fill="#10b981" filter="url(#strongGlow)" />
  <circle cx="385" cy="255" r="3.5" fill="#10b981" filter="url(#strongGlow)" />

  <!-- Node 1: Top-Left (Admin Subnet / Switch) -->
  <g transform="translate(95, 80)">
    <rect width="90" height="75" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5" />
    <!-- Switch Icon Representation -->
    <rect x="25" y="16" width="40" height="18" rx="4" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1.2" />
    <path d="M 33 25 L 43 25 M 39 21 L 43 25 L 39 29" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M 57 25 L 47 25 M 51 21 L 47 25 L 51 29" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <text x="45" y="49" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">VLAN 10</text>
    <text x="45" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Admin Block</text>
  </g>

  <!-- Node 2: Top-Right (Server Farm Subnet) -->
  <g transform="translate(415, 80)">
    <rect width="90" height="75" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(129, 140, 248, 0.5)" stroke-width="1.5" />
    <!-- Server Rack Icon -->
    <rect x="28" y="15" width="34" height="20" rx="3" fill="rgba(129, 140, 248, 0.2)" stroke="#818cf8" stroke-width="1.2" />
    <line x1="33" y1="21" x2="48" y2="21" stroke="#818cf8" stroke-width="1.5" />
    <line x1="33" y1="26" x2="48" y2="26" stroke="#818cf8" stroke-width="1.5" />
    <line x1="33" y1="31" x2="48" y2="31" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="55" cy="21" r="1.5" fill="#34d399" />
    <circle cx="55" cy="26" r="1.5" fill="#34d399" />
    <circle cx="55" cy="31" r="1.5" fill="#38bdf8" />
    <text x="45" y="49" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Server Farm</text>
    <text x="45" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">192.168.20.0/24</text>
  </g>

  <!-- Node 3: Bottom-Left (IT Dept & Workstations) -->
  <g transform="translate(95, 250)">
    <rect width="90" height="75" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.5)" stroke-width="1.5" />
    <!-- Terminal / PC Screen -->
    <rect x="29" y="16" width="32" height="18" rx="2" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.2" />
    <line x1="45" y1="34" x2="45" y2="38" stroke="#10b981" stroke-width="1.5" />
    <line x1="38" y1="38" x2="52" y2="38" stroke="#10b981" stroke-width="1.5" />
    <text x="45" y="49" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">VLAN 30</text>
    <text x="45" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">IT Operations</text>
  </g>

  <!-- Node 4: Bottom-Right (Firewall & Gateway) -->
  <g transform="translate(415, 250)">
    <rect width="90" height="75" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(244, 114, 182, 0.5)" stroke-width="1.5" />
    <!-- Shield / Security Icon -->
    <path d="M 45 15 L 56 19 L 56 27 C 56 34 45 38 45 38 C 45 38 34 34 34 27 L 34 19 Z" fill="rgba(244, 114, 182, 0.2)" stroke="#f472b6" stroke-width="1.2" />
    <text x="45" y="49" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Edge Router</text>
    <text x="45" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">NAT / Firewall</text>
  </g>

  <!-- Central Core Router (Cisco Router) -->
  <g transform="translate(245, 150)">
    <!-- Ambient Pulse Ring -->
    <circle cx="55" cy="55" r="52" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" stroke-dasharray="6,4" />
    <circle cx="55" cy="55" r="42" fill="url(#coreGlow)" filter="url(#softGlow)" opacity="0.25" />
    
    <!-- Cisco Router Cylinder / Disc Shape -->
    <circle cx="55" cy="55" r="38" fill="rgba(15, 23, 42, 0.95)" stroke="#38bdf8" stroke-width="2.5" />

    <!-- 4 Cisco Inward/Outward Routing Arrows -->
    <!-- Up Arrow (inward) -->
    <path d="M 55 24 L 55 36 M 50 31 L 55 36 L 60 31" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Down Arrow (inward) -->
    <path d="M 55 86 L 55 74 M 50 79 L 55 74 L 60 79" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Left Arrow (outward) -->
    <path d="M 44 55 L 24 55 M 29 50 L 24 55 L 29 60" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Arrow (outward) -->
    <path d="M 66 55 L 86 55 M 81 50 L 86 55 L 81 60" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Hub Dot -->
    <circle cx="55" cy="55" r="4" fill="#38bdf8" filter="url(#strongGlow)" />
  </g>

  <!-- Core Router Label -->
  <g transform="translate(240, 260)">
    <rect width="120" height="24" rx="7" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="60" y="16" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">CORE ROUTER</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(140, 345)">
    <rect width="320" height="24" rx="7" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="160" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="500" text-anchor="middle">
      VLAN Trunking • OSPF Routing • DHCP • ACL Security
    </text>
  </g>
</svg>
