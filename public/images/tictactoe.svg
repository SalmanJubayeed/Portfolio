<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021"/>
      <stop offset="50%" stop-color="#141738"/>
      <stop offset="100%" stop-color="#080c1b"/>
    </linearGradient>

    <!-- Neon X Gradient (Sky Cyan) -->
    <linearGradient id="xGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Neon O Gradient (Pink / Purple AI) -->
    <linearGradient id="oGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glowing Grid Gradient -->
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="400" rx="24" fill="url(#aiBg)" />
  <rect width="598" height="398" x="1" y="1" rx="23" fill="none" stroke="rgba(129, 140, 248, 0.25)" stroke-width="2" />

  <!-- Background Grid Dots -->
  <g fill="rgba(255, 255, 255, 0.05)">
    <circle cx="80" cy="80" r="2" />
    <circle cx="160" cy="80" r="2" />
    <circle cx="440" cy="80" r="2" />
    <circle cx="520" cy="80" r="2" />
    <circle cx="80" cy="320" r="2" />
    <circle cx="160" cy="320" r="2" />
    <circle cx="440" cy="320" r="2" />
    <circle cx="520" cy="320" r="2" />
  </g>

  <!-- Top Glass Header Bar -->
  <rect x="40" y="24" width="520" height="38" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <circle cx="62" cy="43" r="4.5" fill="#ef4444" opacity="0.8" />
  <circle cx="77" cy="43" r="4.5" fill="#f59e0b" opacity="0.8" />
  <circle cx="92" cy="43" r="4.5" fill="#10b981" opacity="0.8" />
  <text x="115" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">AI TIC-TAC-TOE // MINIMAX ADVERSARIAL SEARCH</text>
  <rect x="435" y="32" width="110" height="22" rx="6" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
  <circle cx="448" cy="43" r="3" fill="#c084fc" filter="url(#softGlow)" />
  <text x="458" y="47" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">AI OPTIMAL</text>

  <!-- Left: 3x3 Tic Tac Toe Board -->
  <g transform="translate(60, 85)">
    <!-- Board Base Card -->
    <rect width="250" height="250" rx="18" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Grid Lines with Neon Glow -->
    <g stroke="url(#gridGrad)" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)">
      <!-- Vertical lines -->
      <line x1="88" y1="25" x2="88" y2="225" />
      <line x1="162" y1="25" x2="162" y2="225" />
      <!-- Horizontal lines -->
      <line x1="25" y1="88" x2="225" y2="88" />
      <line x1="25" y1="162" x2="225" y2="162" />
    </g>

    <!-- Cells (X and O elements) -->
    <!-- Cell 0,0: X (Top Left) -->
    <g stroke="url(#xGrad)" stroke-width="5" stroke-linecap="round" filter="url(#softGlow)">
      <line x1="42" y1="42" x2="70" y2="70" />
      <line x1="70" y1="42" x2="42" y2="70" />
    </g>

    <!-- Cell 0,1: O (Top Center) -->
    <circle cx="125" cy="56" r="16" fill="none" stroke="url(#oGrad)" stroke-width="5" filter="url(#softGlow)" />

    <!-- Cell 0,2: X (Top Right) -->
    <g stroke="url(#xGrad)" stroke-width="5" stroke-linecap="round" filter="url(#softGlow)">
      <line x1="179" y1="42" x2="207" y2="70" />
      <line x1="207" y1="42" x2="179" y2="70" />
    </g>

    <!-- Cell 1,0: O (Middle Left) -->
    <circle cx="56" cy="125" r="16" fill="none" stroke="url(#oGrad)" stroke-width="5" filter="url(#softGlow)" />

    <!-- Cell 1,1: X (Center - Winning Move) -->
    <g stroke="url(#xGrad)" stroke-width="6" stroke-linecap="round" filter="url(#strongGlow)">
      <line x1="110" y1="110" x2="140" y2="140" />
      <line x1="140" y1="110" x2="110" y2="140" />
    </g>

    <!-- Cell 1,2: Empty / Cursor Highlight -->
    <rect x="174" y="100" width="38" height="50" rx="6" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.3)" stroke-dasharray="3,3" />
    <text x="193" y="130" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">?</text>

    <!-- Cell 2,0: O (Bottom Left) -->
    <circle cx="56" cy="193" r="16" fill="none" stroke="url(#oGrad)" stroke-width="5" filter="url(#softGlow)" />

    <!-- Cell 2,2: X (Bottom Right - Diagonal Win line) -->
    <g stroke="url(#xGrad)" stroke-width="5" stroke-linecap="round" filter="url(#softGlow)">
      <line x1="179" y1="179" x2="207" y2="207" />
      <line x1="207" y1="179" x2="179" y2="207" />
    </g>

    <!-- Diagonal Winning Ray (Strike Through) -->
    <line x1="38" y1="38" x2="212" y2="212" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#strongGlow)" opacity="0.85" />
  </g>

  <!-- Right: Minimax Search Tree & AI Metrics -->
  <g transform="translate(330, 85)">
    <!-- Right Container Card -->
    <rect width="230" height="250" rx="18" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <text x="20" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Minimax Decision Tree</text>
    <text x="20" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Max / Min Tree Traversal</text>

    <!-- Mini Tree Diagram -->
    <g transform="translate(115, 60)">
      <!-- Root Node (Max) -->
      <circle cx="0" cy="0" r="10" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1.5" />
      <text x="0" y="3" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">MAX</text>

      <!-- Branches -->
      <line x1="0" y1="10" x2="-55" y2="35" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
      <line x1="0" y1="10" x2="0" y2="35" stroke="#38bdf8" stroke-width="1.8" filter="url(#softGlow)" />
      <line x1="0" y1="10" x2="55" y2="35" stroke="rgba(255,255,255,0.2)" stroke-width="1" />

      <!-- Depth 1 Nodes (Min) -->
      <g transform="translate(-55, 38)">
        <circle cx="0" cy="0" r="9" fill="rgba(244, 114, 182, 0.2)" stroke="#f472b6" stroke-width="1.2" />
        <text x="0" y="3" fill="#f472b6" font-family="system-ui, sans-serif" font-size="7" font-weight="700" text-anchor="middle">-1</text>
      </g>
      <g transform="translate(0, 38)">
        <circle cx="0" cy="0" r="10" fill="rgba(56, 189, 248, 0.3)" stroke="#38bdf8" stroke-width="2" filter="url(#softGlow)" />
        <text x="0" y="3" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">+10</text>
      </g>
      <g transform="translate(55, 38)">
        <circle cx="0" cy="0" r="9" fill="rgba(244, 114, 182, 0.2)" stroke="#f472b6" stroke-width="1.2" />
        <text x="0" y="3" fill="#f472b6" font-family="system-ui, sans-serif" font-size="7" font-weight="700" text-anchor="middle">0</text>
      </g>

      <!-- Sub Branches from Optimal Node -->
      <line x1="0" y1="48" x2="-25" y2="70" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <line x1="0" y1="48" x2="25" y2="70" stroke="#38bdf8" stroke-width="1.5" />

      <!-- Leaf Nodes -->
      <circle cx="-25" cy="74" r="5" fill="#f472b6" opacity="0.7" />
      <circle cx="25" cy="74" r="6" fill="#38bdf8" filter="url(#softGlow)" />
    </g>

    <!-- AI Stats Panel -->
    <g transform="translate(15, 160)">
      <rect width="200" height="32" rx="7" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
      <text x="12" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">HEURISTIC SCORE</text>
      <text x="12" y="27" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">+10 (Guaranteed Win / Draw)</text>
    </g>

    <g transform="translate(15, 198)">
      <rect width="200" height="36" rx="7" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <text x="12" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">SEARCH ALGORITHM</text>
      <text x="12" y="29" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Minimax w/ Alpha-Beta Pruning</text>
    </g>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(120, 350)">
    <rect width="360" height="26" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1" />
    <text x="180" y="17" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="500" text-anchor="middle">
      Built with Python • Adversarial Game Search • Heuristic Evaluation
    </text>
  </g>
</svg>
