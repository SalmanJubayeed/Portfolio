<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091322"/>
      <stop offset="50%" stop-color="#0c1d36"/>
      <stop offset="100%" stop-color="#08101e"/>
    </linearGradient>

    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="barGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="400" rx="24" fill="url(#bgGrad)" />

  <!-- Outer Glass Border -->
  <rect width="598" height="398" x="1" y="1" rx="23" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" />

  <!-- Grid Pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="40" y1="60" x2="560" y2="60" />
    <line x1="40" y1="120" x2="560" y2="120" />
    <line x1="40" y1="180" x2="560" y2="180" />
    <line x1="40" y1="240" x2="560" y2="240" />
    <line x1="40" y1="300" x2="560" y2="300" />
    <line x1="40" y1="360" x2="560" y2="360" />

    <line x1="100" y1="40" x2="100" y2="360" />
    <line x1="200" y1="40" x2="200" y2="360" />
    <line x1="300" y1="40" x2="300" y2="360" />
    <line x1="400" y1="40" x2="400" y2="360" />
    <line x1="500" y1="40" x2="500" y2="360" />
  </g>

  <!-- Decorative Top Ambient Lights -->
  <circle cx="150" cy="80" r="90" fill="#38bdf8" opacity="0.12" filter="url(#neonGlow)"/>
  <circle cx="450" cy="120" r="110" fill="#818cf8" opacity="0.12" filter="url(#neonGlow)"/>

  <!-- Top Glass Bar (Dashboard Header) -->
  <rect x="40" y="30" width="520" height="42" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  
  <!-- Window dots -->
  <circle cx="65" cy="51" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="82" cy="51" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="99" cy="51" r="5" fill="#10b981" opacity="0.8" />
  
  <text x="130" y="56" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1">CAMPUS FACILITY ANALYTICS // ASP.NET</text>
  
  <rect x="440" y="40" width="105" height="22" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
  <circle cx="454" cy="51" r="3.5" fill="#38bdf8" filter="url(#softGlow)" />
  <text x="466" y="55" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">LIVE METRICS</text>

  <!-- Left Card: Campus Infrastructure / Building Silhouettes -->
  <g transform="translate(45, 95)">
    <!-- Glass card container -->
    <rect width="210" height="260" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="20" y="32" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Facilities Map</text>
    <text x="20" y="50" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Zone Utilization</text>

    <!-- Campus Building 1 (Center Hall) -->
    <rect x="75" y="85" width="60" height="135" rx="4" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.6)" stroke-width="1.5" />
    <!-- Roof / Triangle -->
    <polygon points="105,62 65,85 145,85" fill="rgba(30, 41, 59, 0.9)" stroke="rgba(56, 189, 248, 0.6)" stroke-width="1.5" />
    <circle cx="105" cy="76" r="4" fill="#38bdf8" />

    <!-- Building Windows Grid -->
    <g fill="#38bdf8" opacity="0.75">
      <rect x="85" y="98" width="8" height="12" rx="1.5" />
      <rect x="101" y="98" width="8" height="12" rx="1.5" />
      <rect x="117" y="98" width="8" height="12" rx="1.5" />

      <rect x="85" y="120" width="8" height="12" rx="1.5" />
      <rect x="101" y="120" width="8" height="12" rx="1.5" fill="#fbbf24" />
      <rect x="117" y="120" width="8" height="12" rx="1.5" />

      <rect x="85" y="142" width="8" height="12" rx="1.5" />
      <rect x="101" y="142" width="8" height="12" rx="1.5" />
      <rect x="117" y="142" width="8" height="12" rx="1.5" fill="#fbbf24" />

      <rect x="85" y="164" width="8" height="12" rx="1.5" />
      <rect x="101" y="164" width="8" height="12" rx="1.5" />
      <rect x="117" y="164" width="8" height="12" rx="1.5" />
    </g>

    <!-- Campus Left Wing -->
    <rect x="25" y="125" width="45" height="95" rx="3" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(129, 140, 248, 0.5)" stroke-width="1.2" />
    <g fill="#818cf8" opacity="0.6">
      <rect x="33" y="138" width="7" height="10" rx="1" />
      <rect x="47" y="138" width="7" height="10" rx="1" />
      <rect x="33" y="156" width="7" height="10" rx="1" />
      <rect x="47" y="156" width="7" height="10" rx="1" />
      <rect x="33" y="174" width="7" height="10" rx="1" />
      <rect x="47" y="174" width="7" height="10" rx="1" />
    </g>

    <!-- Campus Right Wing (Lab Tower) -->
    <rect x="140" y="110" width="45" height="110" rx="3" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(52, 211, 153, 0.5)" stroke-width="1.2" />
    <g fill="#34d399" opacity="0.6">
      <rect x="148" y="122" width="7" height="10" rx="1" />
      <rect x="162" y="122" width="7" height="10" rx="1" />
      <rect x="148" y="140" width="7" height="10" rx="1" />
      <rect x="162" y="140" width="7" height="10" rx="1" />
      <rect x="148" y="158" width="7" height="10" rx="1" />
      <rect x="162" y="158" width="7" height="10" rx="1" />
      <rect x="148" y="176" width="7" height="10" rx="1" />
      <rect x="162" y="176" width="7" height="10" rx="1" />
    </g>

    <!-- Status badge bottom -->
    <rect x="25" y="226" width="160" height="20" rx="6" fill="rgba(56, 189, 248, 0.1)" />
    <text x="105" y="240" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">FACILITY EFFICIENCY: 94.2%</text>
  </g>

  <!-- Right Card: Analytics Graphs & Chart Metrics -->
  <g transform="translate(275, 95)">
    <rect width="280" height="260" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Card Header -->
    <text x="20" y="32" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Campus Analytics</text>
    <text x="20" y="50" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Energy, Traffic &amp; Space Analytics</text>

    <!-- Stat Pills -->
    <g transform="translate(20, 65)">
      <rect width="70" height="36" rx="8" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
      <text x="10" y="18" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">BLOCKS</text>
      <text x="10" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">18</text>
    </g>
    <g transform="translate(100, 65)">
      <rect width="75" height="36" rx="8" fill="rgba(129, 140, 248, 0.08)" stroke="rgba(129, 140, 248, 0.2)" stroke-width="1"/>
      <text x="10" y="18" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">SENSORS</text>
      <text x="10" y="30" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">1,240</text>
    </g>
    <g transform="translate(185, 65)">
      <rect width="75" height="36" rx="8" fill="rgba(52, 211, 153, 0.08)" stroke="rgba(52, 211, 153, 0.2)" stroke-width="1"/>
      <text x="10" y="18" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">ACTIVE</text>
      <text x="10" y="30" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">+8.5%</text>
    </g>

    <!-- Bar Chart Grid Base -->
    <g transform="translate(20, 115)">
      <line x1="0" y1="95" x2="240" y2="95" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <line x1="0" y1="65" x2="240" y2="65" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="3,3" />
      <line x1="0" y1="35" x2="240" y2="35" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="3,3" />
      <line x1="0" y1="5" x2="240" y2="5" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="3,3" />

      <!-- Bars -->
      <rect x="15" y="45" width="22" height="50" rx="4" fill="url(#barGrad1)" />
      <rect x="47" y="30" width="22" height="65" rx="4" fill="url(#barGrad2)" />
      <rect x="79" y="55" width="22" height="40" rx="4" fill="url(#barGrad1)" />
      <rect x="111" y="20" width="22" height="75" rx="4" fill="url(#barGrad3)" />
      <rect x="143" y="38" width="22" height="57" rx="4" fill="url(#barGrad2)" />
      <rect x="175" y="15" width="22" height="80" rx="4" fill="url(#barGrad1)" />
      <rect x="207" y="28" width="22" height="67" rx="4" fill="url(#barGrad4)" />

      <!-- Curved Trend Line Glowing Over Bars -->
      <path d="M 26 40 Q 58 18, 90 48 T 154 30 T 218 20" fill="none" stroke="url(#glowLine)" stroke-width="3" filter="url(#softGlow)" />
      
      <!-- Trend Points -->
      <circle cx="26" cy="40" r="3.5" fill="#38bdf8" filter="url(#softGlow)" />
      <circle cx="122" cy="18" r="3.5" fill="#34d399" filter="url(#softGlow)" />
      <circle cx="218" cy="20" r="3.5" fill="#c084fc" filter="url(#softGlow)" />

      <!-- Labels -->
      <text x="26" y="112" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">A-1</text>
      <text x="58" y="112" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">B-2</text>
      <text x="90" y="112" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">C-1</text>
      <text x="122" y="112" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">D-4</text>
      <text x="154" y="112" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">E-2</text>
      <text x="186" y="112" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">F-1</text>
      <text x="218" y="112" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">G-3</text>
    </g>

    <!-- Bottom Pill: Tech Stack Indicator -->
    <g transform="translate(20, 228)">
      <rect width="240" height="22" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <text x="120" y="15" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="500" text-anchor="middle">
        Built with C# • ASP.NET • Visual Studio Code
      </text>
    </g>
  </g>
</svg>
